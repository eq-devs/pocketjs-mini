name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - name: Public commands, reload and cleanup
        run: bash tests/check.sh
      - name: Native guest and interactive Flutter acceptance
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash tests/flutter.sh linux
          else
            bash tests/flutter.sh macos
          fi
      - name: Verify tracked source stays clean
        run: git diff --exit-code
  iphone:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true
      - name: Boot an available iPhone simulator and run acceptance
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          simulator_id=$(bun -e 'const list=await Bun.file(Bun.argv[1]).json();const d=Object.values(list.devices).flat().find(d=>d.name.startsWith("iPhone"));if(!d)throw Error("No iPhone simulator");console.log(d.udid)' "$RUNNER_TEMP/devices.json")
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          bash tests/flutter.sh "$simulator_id"
      - name: Verify tracked source stays clean
        run: git diff --exit-code
