name: Validate
on:
  push:
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commands:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Public commands, adaptive plans, reload and cleanup
        run: bash tests/check.sh
      - run: git diff --exit-code
  iphone:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Native guest, actual taps, full phone layout, rotation and recovery
        env:
          PJM_TEST_RESULTS: ${{ runner.temp }}/Mini.xcresult
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          simulator_id=$(bun -e 'const list=await Bun.file(Bun.argv[1]).json();const d=(list.devices["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]??[]).find(d=>d.name==="iPhone 16 Pro");if(!d)throw Error("No iOS 18.5 iPhone 16 Pro simulator");console.log(d.udid)' "$RUNNER_TEMP/devices.json")
          bash tests/native.sh "$simulator_id"
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-iphone-acceptance
          path: ${{ runner.temp }}/Mini.xcresult
